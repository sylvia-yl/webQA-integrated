version: 1
target: https://staging.evomap.work

scope:
  same_host: true
  # 主页为第 0 层；这里的值表示最多允许进入的子页面层数。
  max_page_depth: 3
  desktop_only: true
  viewport:
    width: 1440
    height: 900

expected_behavior:
  # 字符串规则会作为可追溯需求保存；需要确定性自动判定时使用下面的结构化格式。
  - source: product_requirement
    reference: 通用页面质量要求
    expected_result: 页面内容与控件语义一致
    confidence: medium

semantic:
  # 每次打开起始页、子页面或复现页后，都必须经过统一观察和语义分类。
  enabled: true
  required: true
  loading_timeout_ms: 8000
  model:
    # 当前先启用确定性语义规则。接入模型适配器后再开启；若开启但不可用，
    # 结果会明确标记 SEMANTIC_CHECK_UNAVAILABLE，不会静默算作通过。
    enabled: false
    required: false
    provider: none
    # 启用时设置为 package.module:factory；factory(options) 返回带 evaluate(...) 的适配器。
    adapter: ""
    options: {}
  # 可按项目补充，不需要改 Python 代码。
  failure_patterns: []
  empty_state_patterns: []

testing:
  # 启动脚本会询问：smoke 快速验证，full 全量探索与全部安全用例。
  profile: full
  profiles:
    smoke:
      traversal:
        max_pages: 40
        max_states_per_page: 8
        max_controls_per_state: 120
        max_actions_per_page: 80
      form_case_types: [valid]
      run_business_flows: true
      run_invariants: true
      list_item_samples: 1
      pagination_samples: 3
    full:
      traversal: {}
      form_case_types: all
      run_business_flows: true
      run_invariants: true
      list_item_samples: 2
      pagination_samples: 3
  form_execution:
    enabled: true
    restore_original_value: true
  invariants:
    enabled: true
    auto_detect: true
    # 可按控件标签显式声明 idempotent/reversible/non_decreasing_count/
    # non_increasing_count/same_collection_members/stable_structure。
    rules: []
  list_sampling:
    enabled: true
    # 同一重复结构达到此数量后按列表处理；冒烟取 1 个详情，全量取头尾 2 个。
    min_repeated_items: 6
    item_detail_samples: 2
    pagination_samples: 3
    # 样本详情会真实点击并验证加载；其余重复项只计入覆盖总账。
    open_sampled_items: true

contracts:
  api:
    enabled: true
    automatic_http_errors: true
    capture_json_bytes: 262144
    # 规则支持 page_url_regex、url_regex、methods、statuses、content_types、json_schema、
    # required_fields、enums 和 required。
    rules: []
  ui:
    enabled: true
    automatic_title: true
    automatic_accessible_names: true
    # 规则支持 path_regex、title_regex、required_roles、required_selectors、
    # required_text、forbidden_text 和 required_regions。
    rules: []

# Given/When/Then 业务流程。默认只允许只读动作；持久化流程需要双重显式授权。
business_flows: []

accounts:
  mode: guest
  storage_state: null
  # 多角色业务流程可分别指定 Playwright storage_state。
  roles: {}

test_data:
  prefix: webqa-run-

prohibited:
  - payment
  - delete
  - publish
  - oauth

exclude:
  - ai_answer_quality

language: zh-CN

safety:
  # 保存、提交、发送、登录等持久化动作必须显式开启。
  allow_stateful_actions: false
  # 删除、支付、发布等高影响动作除开启外，还必须从 prohibited 中移除对应禁词。
  allow_destructive_actions: false
  # 未知按钮只执行一次；结果不确定时不会自动重试。
  allow_unknown_actions: true
  redaction_enabled: true
  redact_emails: true
  redact_phone_numbers: true
  sensitive_keys: []
  mask_form_fields_in_screenshots: true
  capture_screenshots: true
  # Trace 可能包含完整 DOM 和网络上下文，默认关闭。
  capture_traces: false
  # URL 带令牌等敏感参数时，默认不把页面交给外部视觉审计工具。
  allow_sensitive_pagepatrol: false
  # 启动 URL 含敏感参数时默认拒绝运行，避免明文写入断点数据库。
  allow_sensitive_target_storage: false

deduplication:
  shared_controls:
    # 首次完整测试；后续页面确认控件仍可见、可用且指纹一致后，不再点击。
    enabled: true
    policy: verify_then_reuse
    scopes: [header, footer, nav, fixed, sticky, configured]
    # high 要求稳定属性、固定链接或显式配置；改成 medium 会接受全局区域中的语义匹配。
    min_confidence: high
    # 对没有稳定 id/data-testid 的 AI 助手等控件，可在这里显式指定。
    include_selectors: []
    # 页面业务表单提交按钮不参与跨页面复用。
    exclude_selectors:
      - "form button[type='submit']"
      - "form input[type='submit']"

traversal:
  # 同一深度全部完成后，才开始下一层。
  strategy: layered
  parallel_pages: 3
  max_pages: 500
  max_states_per_page: 40
  max_controls_per_state: 400
  max_actions_per_page: 1200
  action_timeout_ms: 8000
  navigation_timeout_ms: 30000
  settle_ms: 900
  retry_limit: 2
  # 点击出现新状态时，新控件进入当前页面队列最前面。
  new_state_controls: front
  # 同一运行中已点击过的目标链接只记录，不再点击。
  duplicate_links: record_only
  # 当前页只记录下一层链接；达到 max_page_depth 后才提升为标准页面测试。
  # 后续用同一网址提高层数并续跑，会复用历史结果且不重测已完成页面。
  child_page_check: record_only
  history_scope: run

pagepatrol:
  enabled: true
  executable: D:\KimiData\kimi\Workspaces\测试开发\pagepatrol-venv\Scripts\pagepatrol.exe
  viewport: desktop
  open_report: true
  timeout_seconds: 180
  # 总报告只导入明显缺陷；正常、warning 和 info 仍保留在 PagePatrol 原报告。
  import_severities: [error]

output:
  directory: webqa-output
  database: webqa.sqlite3
  report_markdown: WebQA测试报告.md
  report_html: WebQA测试报告.html
